# =============================================
# 即時翻譯 UI — 設定檔
# 修改後重新啟動容器即可生效
# =============================================

# Ollama 服務位址
# Docker 單機版：服務名稱 ollama；外部 Ollama：http://ai:11434
ollama_base_url: "http://ollama:11434"

# 預設翻譯模型（需已 ollama pull）
# 推薦小模型：qwen2.5:1.5b (1.1 GB) / qwen2.5:3b (2.0 GB) / qwen2.5:7b (4.7 GB)
default_model: "qwen2.5:1.5b"

# 預設語言對
#   支援值: zh-TW, zh-CN, en, ja, ko
default_source_lang: "zh-TW"
default_target_lang: "en"

# Whisper STT 服務 (faster-whisper)
# Docker 內部位址；外部 Whisper 請改為 http://<host>:8000
whisper_base_url: "http://whisper:8000"
# 可選模型：tiny / base / small / medium / large-v3
whisper_model: "Systran/faster-whisper-small"
