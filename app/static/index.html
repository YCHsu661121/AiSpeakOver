<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#181818" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>AiSpeakOver</title>
  <link rel="icon" href="favicon.ico" />
  <link rel="stylesheet" href="style.css?v=20260612l" />
</head>
<body>
  <div class="app">

    <!-- ── Top bar ─────────────────────────────────────────── -->
    <header class="topbar">
      <div class="brand">🎙 AiSpeakOver</div>

      <div class="controls">
        <!-- Language pair (hidden in dual mode) -->
        <div class="lang-pair" id="langPairSingle">
          <select id="sourceLang">
            <option value="zh-TW">中文（繁體）</option>
            <option value="zh-CN">中文（简体）</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
          </select>
          <button id="swapBtn" title="交換語言">⇄</button>
          <select id="targetLang">
            <option value="en">English</option>
            <option value="zh-TW">中文（繁體）</option>
            <option value="zh-CN">中文（简体）</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
          </select>
        </div>

        <!-- Model -->
        <select id="modelSelect" title="選擇模型">
          <option value="">載入中…</option>
        </select>

        <!-- STT mode -->
        <select id="sttToggle" title="語音辨識模式">
          <option value="webspeech">🌐 Web Speech</option>
          <option value="whisper">🤫 Whisper (本地)</option>
          <option value="nemo">🔥 NeMo (NVIDIA)</option>
        </select>

        <!-- Dual mode toggle -->
        <button id="modeToggle" title="切換雙向模式">&#x21c4; 雙向</button>

        <!-- Mic indicator -->
        <div class="mic-badge" id="micBadge">
          <span class="dot"></span>
          <span id="micLabel">初始化</span>
        </div>

        <!-- Debug toggle -->
        <div id="debugToggleBtn" title="Debug Log (Ctrl+Shift+D)" onclick="toggleDebugPanel()">🐞</div>
      </div>
    </header>

    <!-- ── Single-speaker panels ─────────────────────────── -->
    <main class="panels" id="panelsSingle">

      <!-- Left: speech -->
      <div class="panel" id="panelSrc">
        <div class="panel-head">
          <span id="srcLangLabel">中文（繁體）</span>
          <span class="tag">語音識別</span>
        </div>
        <div class="panel-body" id="srcBody">
          <div id="finalText"></div>
          <div id="interimText" class="interim"></div>
        </div>
        <div class="panel-foot">
          <button class="btn-ghost" onclick="clearAll()">清除</button>
        </div>
      </div>

      <!-- Divider -->
      <div class="divider">→</div>

      <!-- Right: translation -->
      <div class="panel" id="panelTgt">
        <div class="panel-head">
          <span id="tgtLangLabel">English</span>
          <span class="tag">翻譯結果</span>
        </div>
        <div class="panel-body" id="tgtBody">
          <div id="translationOut"></div>
        </div>
        <div class="panel-foot">
          <button class="btn-ghost" onclick="copyResult()">複製</button>
        </div>
      </div>
    </main>

    <!-- ── Dual-speaker panels (hidden until mode toggle) ─── -->
    <main class="panels dual-panels" id="panelsDual" hidden>

      <!-- Toolbar: record + speaker indicators + reset -->
      <div class="dual-toolbar">
        <button id="dualRecordToggle" class="dual-rec-btn">▶ 開始辨識</button>
        <div class="spk-indicators">
          <span class="spk-badge spk-a" id="spkBadgeA">🔵 講者 A</span>
          <span class="spk-badge spk-b" id="spkBadgeB">🟠 講者 B</span>
        </div>
        <button id="dualReset" class="btn-ghost">🔄 重設講者</button>
      </div>

      <!-- Speaker A -->
      <div class="dual-col" id="dualColA">
        <div class="dual-head">
          <select id="dualLangA">
            <option value="zh-TW">中文（繁體）</option>
            <option value="zh-CN">中文（简体）</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
          </select>
          <span class="dual-arrow">→</span>
          <span class="dual-tgt-label" id="dualTgtLabelA">English</span>
        </div>
        <div class="dual-body">
          <div class="dual-speech" id="dual-speech-a"></div>
          <div class="dual-divider-label">↓ 翻譯</div>
          <div class="dual-trans" id="dual-trans-a"></div>
        </div>
        <div class="dual-foot">
          <button class="btn-ghost" onclick="clearDual('a')">&#x1F9F9; 清除</button>
        </div>
      </div>

      <!-- Center divider -->
      <div class="dual-center-divider"></div>

      <!-- Speaker B -->
      <div class="dual-col" id="dualColB">
        <div class="dual-head">
          <select id="dualLangB">
            <option value="en" selected>English</option>
            <option value="zh-TW">中文（繁體）</option>
            <option value="zh-CN">中文（简体）</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
          </select>
          <span class="dual-arrow">→</span>
          <span class="dual-tgt-label" id="dualTgtLabelB">中文（繁體）</span>
        </div>
        <div class="dual-body" id="dualBodyB">
          <div class="dual-speech" id="dual-speech-b"></div>
          <div class="dual-divider-label">↓ 翻譯</div>
          <div class="dual-trans" id="dual-trans-b"></div>
        </div>
        <div class="dual-foot">
          <button class="btn-ghost" onclick="clearDual('b')">&#x1F9F9; 清除</button>
        </div>
      </div>

    </main>

    <!-- ── Status bar ──────────────────────────────────────── -->
    <div class="statusbar" id="statusBar">準備中…</div>

    <!-- ── Mic monitor (floating) ───────────────────────────── -->
    <div class="mic-monitor" id="micMonitor">
      <div class="mic-monitor-title">🎙 麥克風</div>
      <canvas id="volCanvas" width="120" height="36"></canvas>
      <div class="mic-monitor-label" id="volLabel">-- dB</div>
    </div>

  </div>

  <!-- ── Model picker overlay ──────────────────────────────── -->
  <div class="model-picker" id="modelPicker" hidden>
    <div class="picker-card">
      <div class="picker-header">
        <div class="picker-title">📦 選擇翻譯模型</div>
        <div class="picker-sub">Ollama 尚未安裝任何模型，請選擇一個下載：</div>
      </div>
      <div class="picker-list" id="pickerList">
        <div class="picker-loading">載入推薦清單…</div>
      </div>
      <div class="picker-custom">
        <input type="text" id="customModelInput" placeholder="或輸入模型名稱，如 qwen2.5:7b" spellcheck="false" />
        <button id="customPullBtn">下載</button>
      </div>
    </div>
  </div>

  <!-- ── Debug log panel ───────────────────────────────────── -->
  <div id="debugPanel" hidden>
    <div class="debug-header">
      <span>🐞 Debug Log</span>
      <div class="debug-actions">
        <button onclick="downloadDebugLog()" title="下載 Log">💾</button>
        <button onclick="clearDebugLog()">🧹</button>
        <button onclick="toggleDebugPanel()">&#x2715;</button>
      </div>
    </div>
    <div id="debugLog"></div>
  </div>

  <script src="app.js?v=20260612m"></script>
</body>
</html>
