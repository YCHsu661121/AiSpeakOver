# =============================================
# 即時翻譯 UI — 設定檔
# 修改後重新啟動容器即可生效
# =============================================

# Ollama 服務位址
# Docker 單機版：服務名稱 ollama；外部 Ollama：http://ai:11434
ollama_base_url: "http://ollama:11434"

# 預設翻譯模型（需已 ollama pull）
# 推薦小模型：qwen2.5:1.5b (1.1 GB) / qwen2.5:3b (2.0 GB) / qwen2.5:7b (4.7 GB)
default_model: "qwen2.5:1.5b"

# 預設語言對
#   支援值: zh-TW, zh-CN, en, ja, ko
default_source_lang: "zh-TW"
default_target_lang: "en"

# 預設語音辨識模式：webspeech | whisper | nemo
# 使用 NeMo profile 時請改為 "nemo"（或設定環境變數 DEFAULT_STT=nemo）
default_stt: "whisper"

# Whisper STT 服務 (faster-whisper)
# Docker 內部位址；外部 Whisper 請改為 http://<host>:8000
whisper_base_url: "http://whisper:8000"
# 可選模型：tiny / base / small / medium / large-v3
whisper_model: "Systran/faster-whisper-small"

# NeMo ASR 服務 (NVIDIA NeMo，需 NVIDIA GPU)
# 啟動方式：docker compose --profile nemo up -d
# 推薦中文模型：stt_zh_conformer_ctc_large / stt_zh_conformer_transducer_large
# 推薦英文模型：nvidia/parakeet-tdt-0.6b-v2
# 推薦日文模型：stt_ja_fastconformer_hybrid_large
# 推薦韓文模型：stt_ko_conformer_ctc_large
nemo_base_url: "http://nemo-asr:8001"
nemo_model: "stt_zh_conformer_ctc_large"

# 講者辨識 (resemblyzer + spectralcluster)
diarize_base_url: "http://diarize:8002"
# 相似度關母對：越高越嚴格（講者需要更相似才被認為同一人）
sim_threshold: 0.80
